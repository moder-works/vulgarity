name: CI

# The runner supplies the toolchain. This workflow installs nothing, so keep
# .NET 8 or later, the Dart SDK 3.1 or later, and Python 3.9 or later on the
# machine. The preflight step reports what it found and fails with a clear
# message when something is missing.
#
# To pin a specific machine, replace `self-hosted` with a label list, for
# example `[self-hosted, macos, vulgarity]`.
#
# A hosted-runner matrix over several SDK versions is a follow-up. It would
# need actions/setup-dotnet and dart-lang/setup-dart, and those download a
# toolchain, which is the one thing this workflow deliberately does not do.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dotnet:
    name: .NET tests
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: |
          command -v dotnet >/dev/null || { echo "::error::dotnet is not on PATH."; exit 1; }
          echo "dotnet $(dotnet --version)"

      - name: Build both target frameworks
        run: dotnet build dotnet/src/Vulgarity/Vulgarity.csproj -c Release --nologo

      - name: Test
        run: >
          dotnet test dotnet/tests/Vulgarity.Tests/Vulgarity.Tests.csproj
          -c Release --nologo
          --logger "trx;LogFileName=dotnet-tests.trx"
          --results-directory artifacts/dotnet

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: artifacts/dotnet
          if-no-files-found: ignore

  dart:
    name: Dart tests
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: |
          command -v dart >/dev/null || { echo "::error::dart is not on PATH."; exit 1; }
          dart --version

      - name: Resolve dependencies
        working-directory: dart
        run: dart pub get

      - name: Analyze
        working-directory: dart
        run: dart analyze --fatal-infos

      - name: Check formatting
        working-directory: dart
        run: dart format --output=none --set-exit-if-changed lib test example

      - name: Test
        working-directory: dart
        run: dart test --reporter expanded

      # pana is the analysis pub.dev runs on every publish, so run it here and
      # not after the fact.
      #
      # The threshold is not zero. pana withholds the pubspec points unless it
      # can reach the repository over the network and find it public, which a
      # checkout on a self-hosted box cannot promise. That is a whole 10-point
      # item, and the package scores 150/160 today for exactly that reason.
      #
      # 20 points of slack covers it with one item to spare, and nothing more:
      # a real regression in the documentation, the platform support or the
      # static analysis costs 10 or 20 points on its own and still fails here.
      - name: Package score
        working-directory: dart
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 20 .

      # The README promises the package runs on Flutter web. Neither the tests
      # nor the analyzer prove that: dart:io in a stray import compiles fine on
      # the VM and only fails when someone builds for the browser. These two
      # compilers are that proof, for both of the web back ends.
      - name: The package builds for the web
        working-directory: dart
        run: |
          dart compile js -O2 -o "$RUNNER_TEMP/example.js" example/vulgarity_example.dart
          dart compile wasm -o "$RUNNER_TEMP/example.wasm" example/vulgarity_example.dart

      # .pubignore keeps dart/test out of the published archive. This checks the
      # file list, so a bad ignore rule fails here and not on pub.dev.
      #
      # The dry-run's own exit code counts too. It is the same validation
      # pub.dev applies on upload, so anything it rejects would fail the real
      # publish. The grep is the extra assertion on top: the dry-run is happy to
      # publish a package whose archive holds the wrong files.
      - name: The published file list is right
        working-directory: dart
        run: |
          status=0
          dart pub publish --dry-run > "$RUNNER_TEMP/publish.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/publish.txt"

          if grep -qE '(^|── )test(/|$)' "$RUNNER_TEMP/publish.txt"; then
            echo "::error::dart/test would be published. Check dart/.pubignore."
            exit 1
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::dart pub publish --dry-run failed. See the output above."
            exit "$status"
          fi

          echo "dart/test is not in the published archive."

  contract:
    name: Shared contract
    runs-on: self-hosted
    timeout-minutes: 20
    needs: [dotnet, dart]
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: |
          command -v python3 >/dev/null || { echo "::error::python3 is not on PATH."; exit 1; }
          python3 --version

      # data/ is generated AND read at run time. A stale generated file means
      # the committed contract no longer matches its source.
      #
      # Order matters. seed.json is the root of the chain, and the packs and the
      # Dart libraries are built from it. Regenerate it FIRST, or the checks
      # below pass against a stale committed copy.
      #
      # The language packs are not rebuilt here. That needs a clone of the
      # upstream corpus, which would make CI depend on an external repository.
      # Rebuild them by hand with tool/gen_lang_packs.py when the source moves.
      - name: The English seed regenerates identically
        run: |
          python3 tool/gen_seed.py
          git diff --exit-code -- data/seed.json \
            || { echo "::error::data/seed.json is stale. Run python3 tool/gen_seed.py"; exit 1; }

      - name: Generated files are current
        run: |
          python3 tool/gen_fold_table.py --check
          python3 tool/gen_packs.py --check
          python3 tool/gen_dart_seeds.py --check
          python3 tool/gen_hostile_packs.py --check

      # tool/ is the third reader of the pack format, and the writer of every
      # generated file above. Its own tests run here, so a change to packlib
      # that the two ports would reject fails before they are even built.
      - name: The Python tools pass their own tests
        run: python3 -m unittest discover -s tool -p 'test_*.py'

      # Stronger than --check, which is hand-written and can drift from the
      # writer it is meant to mirror. This cannot.
      - name: Regenerating changes nothing
        run: |
          python3 tool/gen_packs.py
          python3 tool/gen_dart_seeds.py
          git diff --exit-code -- data/packs dart/lib \
            || { echo "::error::Regenerated files differ from the committed ones."; exit 1; }

      # The packs exist so that no shipped file names a term. Prove it.
      - name: No published file names a term
        run: python3 tool/find_plain_terms.py --check

      # The real parity proof. Both ports run the same inputs, and the output
      # must match byte for byte.
      #
      # The inputs are the twelve inline samples below, which name the
      # behaviours worth reading in a diff, PLUS every evasion spelling in
      # data/testdata/evasions-en.json and every input text in data/vectors.json.
      # A dozen hand-picked strings agreeing proves very little; a thousand real
      # evasions agreeing is the contract.
      #
      # python3 builds the list, not jq: python3 is already a hard requirement
      # of this job and jq is not, so a runner without jq would skip the real
      # data and still pass. The list is NUL separated, so a sample holding a
      # quote, a backslash, a dollar sign or a space reaches the CLI exactly as
      # written. xargs feeds it to each port in batches, because a thousand
      # arguments on one command line is how you meet E2BIG.
      #
      # Neither output goes through `tr`. Case folding the stream to reconcile
      # .NET's "True" with Dart's "true" also rewrote every T and F inside a
      # sample, which turned SHIT into SHIt and hid real disagreements. The .NET
      # example prints its booleans in lower case instead.
      - name: Both ports agree
        run: |
          samples=(
            "Have a nice day."
            "you are a f.u.c.k"
            "what the fuuuuck"
            "sh!t happens"
            "I live in Scunthorpe"
            "he is an assassin"
            "the rapist was caught"
            "my therapist is great"
            'a$$hole'
            "fuck this shit"
            "café 🙂 f.u.c.k end"
            "shiitake mushrooms"
          )

          python3 - "$RUNNER_TEMP/args.nul" "$RUNNER_TEMP/count.txt" "${samples[@]}" <<'PY'
          import json
          import sys

          args_path, count_path, inline = sys.argv[1], sys.argv[2], sys.argv[3:]


          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)


          texts = list(inline)
          texts += load("data/testdata/evasions-en.json")["terms"]
          texts += [case["text"] for case in load("data/vectors.json")["cases"]]

          # An empty argument does not survive every xargs. Drop it here so both
          # ports read the same list whatever the runner ships.
          texts = [text for text in texts if text != ""]

          with open(args_path, "wb") as handle:
              for text in texts:
                  handle.write(text.encode("utf-8") + b"\0")

          with open(count_path, "w", encoding="utf-8") as handle:
              handle.write(str(len(texts)))

          print("parity inputs: %d" % len(texts))
          PY

          dotnet build dotnet/example/Example.csproj -c Release --nologo
          ( cd dart && dart pub get >/dev/null )

          : > "$RUNNER_TEMP/dotnet.txt"
          : > "$RUNNER_TEMP/dart.txt"

          xargs -0 -n 200 dotnet dotnet/example/bin/Release/net8.0/Example.dll \
            < "$RUNNER_TEMP/args.nul" >> "$RUNNER_TEMP/dotnet.txt"

          ( cd dart && xargs -0 -n 200 dart run example/vulgarity_example.dart \
            < "$RUNNER_TEMP/args.nul" ) >> "$RUNNER_TEMP/dart.txt"

          if diff -u "$RUNNER_TEMP/dotnet.txt" "$RUNNER_TEMP/dart.txt"; then
            echo "Both ports produced identical output over $(cat "$RUNNER_TEMP/count.txt") inputs."
          else
            echo "::error::The two ports disagree. See the diff above."
            exit 1
          fi
